<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tom Herschberg — Film Photography</title>
<meta name="description" content="Film photography portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #FAFAF7;
    --ink: #21261F;
    --stone: #82877D;
    --moss: #5C6B54;
    --hairline: #E2E1D8;
    --paper: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stone);
  }

  .display {
    font-family: 'Big Shoulders Display', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 0.92;
  }

  /* ---------- header ---------- */

  header.site-header {
    position: sticky;
    top: 0;
    z-index: 40;
    padding: 14px 28px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(250, 250, 247, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(33, 38, 31, 0.08);
  }

  .wordmark {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: center;
  }

  nav a {
    display: none;
  }
  nav a:hover { opacity: 1; }

  /* ---------- hero ---------- */

  .hero {
    min-height: 0;
    padding: 0;
    position: relative;
    display: flex;
    align-items: stretch;
    background: transparent;
    overflow: visible;
  }

  .hero::after {
    display: none;
  }

  .hero-inner {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    color: var(--ink);
  }

  .hero-title {
    font-size: clamp(32px, 5vw, 64px);
    line-height: 0.9;
    color: rgba(33, 38, 31, 0.95);
    letter-spacing: -0.04em;
    opacity: 0;
    pointer-events: none;
    position: absolute;
    visibility: hidden;
  }

  .hero-meta {
    display: none;
  }

  .scroll-cue {
    position: absolute;
    bottom: 18px;
    left: 32px;
    z-index: 2;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--stone);
    text-transform: uppercase;
    display: none;
  }

  /* ---------- section headings ---------- */

  section { padding: 80px 0; }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 18px;
    margin-bottom: 16px;
    display: none;
  }

  .section-head h2 {
    font-size: clamp(28px, 4vw, 44px);
  }

  /* ---------- work grid ---------- */

  .grid {
    display: flex;
    flex-direction: column;
    gap: 34px;
    align-items: center;
  }

  .photo {
    position: relative;
    width: fit-content;
    max-width: 100%;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .photo.in-view { opacity: 1; transform: translateY(0); }

  .photo.size-a,
  .photo.size-b,
  .photo.size-c,
  .photo.size-d,
  .photo.size-e,
  .photo.size-f,
  .photo.size-g {
    width: fit-content;
    max-width: min(100%, 1180px);
  }

  .photo[data-category="nature"],
  .photo[data-category="city"] {
    background: transparent;
  }

  /* toggle */

  .toggle {
    display: inline-flex;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    background: rgba(255,255,255,0.4);
  }

  .toggle-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stone);
    background: none;
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .toggle-btn.active {
    background: var(--ink);
    color: #fff;
  }

  .toggle-btn:hover:not(.active) { color: var(--ink); }

  .filter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 2px;
    margin-bottom: 14px;
  }

  .search {
    position: relative;
    width: 210px;
    max-width: 100%;
  }

  .search input {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--hairline);
    padding: 6px 18px 6px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s ease;
  }
  .search input::placeholder { color: var(--stone); }
  .search input:focus { border-color: var(--moss); }

  .search::after {
    content: "→";
    position: absolute;
    right: 0;
    top: 8px;
    font-size: 12px;
    color: var(--stone);
    pointer-events: none;
  }

  .photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    margin: 0 auto;
    background: #f0f0ee;
    box-shadow: 0 0 0 1px rgba(33, 38, 31, 0.03);
  }

  @media (min-width: 761px) {
    .photo img {
      max-height: calc(100vh - 150px);
      object-fit: contain;
    }
  }

  .photo.placeholder {
    display: flex;
    min-height: 220px;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: linear-gradient(150deg, #E7E7E1, #C7C9BF 55%, #96998C);
    text-align: center;
  }

  .photo.placeholder .missing {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: #40453B;
    background: rgba(255,255,255,0.55);
    padding: 6px 10px;
    border-radius: 4px;
    word-break: break-all;
  }

  .loading-state,
  .empty-state {
    grid-column: 1 / -1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--stone);
    text-transform: uppercase;
    padding: 40px 0;
  }

  .empty-state { display: none; }
  .empty-state.show { display: block; }

  .no-results {
    grid-column: 1 / -1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--stone);
    text-transform: uppercase;
    padding: 40px 0;
    display: none;
  }
  .no-results.show { display: block; }

  .photo .caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 12px 2px 0;
    opacity: 1;
    transition: opacity 0.3s ease;
  }

  .caption .loc {
    display: inline-block;
    font-family: 'Big Shoulders Display', sans-serif;
    text-transform: uppercase;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: var(--ink);
  }
  .caption .date {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.04em;
    color: var(--stone);
    margin-top: 3px;
  }

  /* ---------- about ---------- */

  .about-grid {
    display: none;
  }

  .about-photo {
    display: none;
  }

  .about-text p {
    display: none;
  }
  .about-text p + p { display: none; }

  /* ---------- footer ---------- */

  footer {
    border-top: 1px solid var(--hairline);
    padding: 40px 0 56px;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .footer-links a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--stone);
    margin-right: 24px;
  }
  .footer-links a:hover { color: var(--moss); }

  .copyright {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--stone);
  }

  .back-to-top {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 60;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(33, 38, 31, 0.2);
    border-radius: 999px;
    background: rgba(250, 250, 247, 0.9);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
  }

  .back-to-top.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* ---------- responsive ---------- */

  @media (max-width: 760px) {
    section { padding: 80px 0; }
    .grid { gap: 18px; }
    .photo {
      width: 100%;
    }
    .photo .caption {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .toggle { margin-top: 4px; }
    .about-grid { grid-template-columns: 1fr; gap: 32px; }
    .hero-inner { flex-direction: column; align-items: flex-start; gap: 18px; }
    .hero-meta { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .photo { transition: none; opacity: 1; transform: none; }
  }

</style>
</head>
<body>

  <header class="site-header">
    <div class="wordmark">Tom Herschberg</div>
    <nav></nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="hero-title display">Nature<br>& City</div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <div class="filter-row">
        <div class="toggle" role="group" aria-label="Filter by category">
          <button type="button" class="toggle-btn active" data-filter="nature">Nature</button>
          <button type="button" class="toggle-btn" data-filter="city">City</button>
        </div>
        <div class="search">
          <input type="text" id="location-search" placeholder="Search by location…" autocomplete="off">
        </div>
      </div>

      <div class="grid" id="photo-grid">
        <p class="loading-state" id="loading-state">Loading photos…</p>
        <p class="empty-state" id="empty-state">No photos yet — add files to images/nature/ or images/city/ and push. See README for the naming convention.</p>
        <p class="no-results" id="no-results">No photos match that search.</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <div class="footer-row">
        <div class="footer-links"></div>
        <div class="copyright">© 2026 Tom Herschberg. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <button class="back-to-top" type="button" aria-label="Back to top">↑</button>

  <script>
    const SIZE_CYCLE = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];

    const grid = document.getElementById('photo-grid');
    const loadingState = document.getElementById('loading-state');
    const emptyState = document.getElementById('empty-state');
    const noResults = document.getElementById('no-results');
    const toggleButtons = document.querySelectorAll('.toggle-btn');
    const searchInput = document.getElementById('location-search');
    const backToTop = document.querySelector('.back-to-top');
    const state = { category: 'nature', query: '' };

    function updateBackToTop() {
      const shouldShow = window.scrollY > 300;
      backToTop.classList.toggle('visible', shouldShow);
    }

    window.addEventListener('scroll', updateBackToTop, { passive: true });
    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    updateBackToTop();

    function buildPhotoEl(item, index) {
      const el = document.createElement('div');
      el.className = `photo size-${SIZE_CYCLE[index % SIZE_CYCLE.length]}`;
      el.dataset.category = item.category;

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.location;
      img.loading = 'lazy';
      img.onerror = () => {
        img.remove();
        el.classList.add('placeholder');
        const missing = document.createElement('span');
        missing.className = 'missing';
        missing.textContent = item.src;
        el.appendChild(missing);
      };

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.innerHTML = `<span class="loc">${item.location}</span>` +
        (item.date ? `<span class="date">${item.date}</span>` : '');

      el.appendChild(img);
      el.appendChild(caption);
      return el;
    }

    function setupRevealAnimation(photos) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      photos.forEach(p => io.observe(p));
    }

    function applyFilters(photos) {
      let visibleCount = 0;
      photos.forEach(p => {
        const loc = p.querySelector('.loc').textContent.toLowerCase();
        const matchesQuery = state.query === '' || loc.includes(state.query);
        // a search takes priority over the category toggle so you can find
        // a place even if you're not sure which category it's filed under
        const matchesCategory = state.query !== '' || p.dataset.category === state.category;
        const visible = matchesQuery && matchesCategory;
        p.style.display = visible ? '' : 'none';
        if (visible) visibleCount++;
      });
      noResults.classList.toggle('show', visibleCount === 0);
    }

    function wireControls(photos) {
      toggleButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          state.category = btn.dataset.filter;
          state.query = '';
          searchInput.value = '';
          toggleButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilters(photos);
        });
      });

      searchInput.addEventListener('input', () => {
        state.query = searchInput.value.trim().toLowerCase();
        toggleButtons.forEach(b => b.classList.toggle('active', state.query === '' && b.dataset.filter === state.category));
        applyFilters(photos);
      });

      applyFilters(photos);
    }

    fetch('images.json')
      .then(res => res.json())
      .then(items => {
        loadingState.remove();
        if (!items.length) {
          emptyState.classList.add('show');
          return;
        }
        const fragment = document.createDocumentFragment();
        items.forEach((item, index) => fragment.appendChild(buildPhotoEl(item, index)));
        grid.appendChild(fragment);

        const photos = document.querySelectorAll('.photo');
        setupRevealAnimation(photos);
        wireControls(photos);
      })
      .catch(err => {
        loadingState.textContent = 'Could not load images.json — check the file exists and you\'re viewing this over http(s), not file://.';
        console.error(err);
      });
  </script>

</body>
</html>
