name: Build image manifest

on:
  push:
    paths:
      - 'images/**'
      - 'scripts/build-manifest.js'
      - 'scripts/optimize_images.py'
      - 'requirements.txt'
      - 'index.html'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install image optimizer
        run: python -m pip install -r requirements.txt

      - name: Generate optimized WebP photos
        run: python scripts/optimize_images.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate optimized site manifest
        run: node scripts/build-manifest.js --optimized --output-dir dist

      - name: Add portfolio page to build output
        run: cp index.html dist/index.html

      - name: Update source manifest
        run: node scripts/build-manifest.js

      - name: Commit source manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          if ! git diff --cached --quiet; then
            git commit -m "Update image manifest"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
